<div class="notifications-container">
  <header class="notifications-header">
    <div class="header-title">
      <h1>Notifications</h1>
      <span class="unread-badge" *ngIf="getUnreadCount() > 0">
        {{ getUnreadCount() }} unread
      </span>
    </div>
    <button class="btn-mark-all" (click)="markAllAsRead()">Mark all as read</button>
  </header>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading notifications...</p>
  </div>

  <div *ngIf="!loading" class="notifications-list">
    <div class="notification-item" *ngFor="let notification of notifications" [class.unread]="!notification.isRead"
      (click)="markAsRead(notification)">

      <iconify-icon class="notification-icon" icon="{{ getIconForType(notification.type) }}"></iconify-icon>

      <div class="notification-content">
        <p class="notification-message">{{ notification.message }}</p>
        <span class="notification-time">{{ notification.createdAt | date:'medium' }}</span>
      </div>

      <div class="notification-status">
        <div class="status-dot" *ngIf="!notification.isRead"></div>
      </div>
    </div>

    <div class="empty-state" *ngIf="notifications.length === 0">
      <iconify-icon class="empty-icon" icon="mdi:email-open-outline"></iconify-icon>
      <p>You have no notifications right now.</p>
    </div>
  </div>
</div>
