<div class="explore-container">
  <h2>Explore & Discover Skills</h2>

  <div class="filter-bar">
    <input
      type="text"
      placeholder="Search by skill (e.g. React)..."
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      class="search-input"
    />

    <select
      [(ngModel)]="selectedTrackId"
      (change)="onFilterByTrack()"
      class="track-select"
    >
      <option value="">All Tracks</option>
      <option *ngFor="let track of tracks" [value]="$any(track)._id || track.id">
        {{ track.name }}
      </option>
    </select>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div class="users-grid" *ngIf="!loading && !errorMessage">
    <div
      class="user-card"
      *ngFor="let user of users"
      (click)="goToUserDetails(user._id)"
    >
      <div class="card-header">
        <img [src]="user.avatarUrl" alt="Avatar" class="avatar" />
        <h3>{{ user.name }}</h3>
      </div>

      <div class="skills-section" *ngIf="user.skillsToTeach?.length">
        <p class="section-title">Can Teach:</p>
        <div class="badges-container">
          <span
            class="badge teach"
            *ngFor="let skill of user.skillsToTeach"
          >
            {{ $any(skill).skillName || $any(skill.skillId)?.name || skill.skillId }}
          </span>
        </div>
      </div>

      <div class="skills-section" *ngIf="user.skillsToLearn?.length">
        <p class="section-title">Wants to Learn:</p>
        <div class="badges-container">
          <span
            class="badge learn"
            *ngFor="let skill of user.skillsToLearn"
          >
            {{ $any(skill).skillName || $any(skill.skillId)?.name || skill.skillId }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
