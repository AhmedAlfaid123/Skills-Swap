<div class="explore-container">
  <h2>Explore & Discover Skills</h2>

  <div class="filter-bar">
    <input type="text" placeholder="Search by skill (e.g. React)..." [(ngModel)]="searchTerm" (input)="onSearch()"
      class="search-input" />

    <select [(ngModel)]="selectedTrackId" (change)="onFilterByTrack()" class="track-select">
      <option value="">All Tracks</option>
      <option *ngFor="let track of tracks" [value]="$any(track)._id || track.id">
        {{ track.name }}
      </option>
    </select>
  </div>

  @if (loading) {
  <div class="users-grid" aria-busy="true">
    @for (skeleton of [1, 2, 3, 4, 5, 6]; track skeleton) {
    <article class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row avatar"></div>
      <div class="skeleton-row title"></div>
      <div class="skeleton-row copy"></div>
      <div class="skeleton-row copy short"></div>
    </article>
    }
  </div>
  }
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div class="users-grid" *ngIf="!loading && !errorMessage">
    <div
      class="user-card"
      *ngFor="let user of users"
      (click)="goToUserDetails($any(user)._id || $any(user).id)"
    >
      <div class="card-header">
        @if (user.avatarUrl) {
          <img [src]="user.avatarUrl" [alt]="user.name" class="avatar" (error)="useDefaultAvatar($event)" />
        } @else {
          <span class="avatar avatar-fallback">{{ getAvatarLabel(user.name) }}</span>
        }
        <h3>{{ user.name }}</h3>
      </div>

      <div class="skills-section" *ngIf="user.skillsToTeach.length">
        <p class="section-title">Can Teach:</p>
        <div class="badges-container">
          <span class="badge teach" *ngFor="let skill of user.skillsToTeach">
            {{ getSkillName(skill) }}
          </span>
        </div>
      </div>

      <div class="skills-section" *ngIf="user.skillsToLearn.length">
        <p class="section-title">Wants to Learn:</p>
        <div class="badges-container">
          <span class="badge learn" *ngFor="let skill of user.skillsToLearn">
            {{ getSkillName(skill) }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
