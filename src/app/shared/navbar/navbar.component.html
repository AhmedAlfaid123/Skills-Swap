<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <a routerLink="/" class="navbar-brand">
        <img src="/logo.png" alt="Logo" class="brand-logo" />
        <span class="brand-text">Skill Swap</span>
      </a>

      <div class="navbar-links">
        <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
        <a routerLink="/explore" routerLinkActive="active" class="nav-link">Explore</a>
        @if(isLoggedIn) {
        <a routerLink="/matching" routerLinkActive="active" class="nav-link">Matching</a>
        <a routerLink="/requests" routerLinkActive="active" class="nav-link">Requests</a>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
        }
      </div>
    </div>

    <div class="navbar-actions">
      @if(isLoggedIn) {
      <ng-container>
        <a routerLink="/notifications" class="notification-bell" [class.has-unread]="unreadNotificationsCount > 0">
          <iconify-icon icon="mdi:bell-outline" class="bell-icon"></iconify-icon>
          <span class="unread-dot" *ngIf="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
        </a>

        <div class="user-menu">
          <button type="button" class="user-avatar profile-trigger" (click)="toggleProfileMenu()">
            @if(avatarLoading) {
            <span class="avatar-skeleton"></span>
            }
            @else if(userAvatar) {
            <img [src]="userAvatar" alt="Avatar" />
            }
            @else {
            <iconify-icon icon="mdi:account-circle" class="default-avatar"></iconify-icon>
            }
          </button>

          @if(showProfileMenu) {
          <div class="profile-dropdown" role="menu">
            <div class="profile-dropdown-header">
              <div class="profile-dropdown-avatar">
                @if(userAvatar) {
                <img [src]="userAvatar" alt="Avatar" />
                } @else {
                <iconify-icon icon="mdi:account-circle" class="default-avatar"></iconify-icon>
                }
              </div>
              <div class="profile-text">
                <span class="profile-title">{{ userName }}</span>
              </div>
            </div>

            <div class="profile-divider"></div>

            <a routerLink="/profile" class="profile-menu-link" (click)="closeProfileMenu()">
              <span class="menu-icon">
                <iconify-icon icon="mdi:account-circle-outline"></iconify-icon>
              </span>
              <span>View Profile</span>
            </a>

            <button type="button" class="btn-logout" (click)="logout()">
              <span class="menu-icon">
                <iconify-icon icon="mdi:logout"></iconify-icon>
              </span>
              <span>Logout</span>
            </button>
          </div>
          }
        </div>
      </ng-container>
      }
      @else {
      <ng-container>
        <div class="auth-buttons">
          <a routerLink="/login" class="btn-login">Login</a>
          <a routerLink="/register" class="btn-register">Register</a>
        </div>
      </ng-container>
      }
    </div>
  </div>
</nav>
